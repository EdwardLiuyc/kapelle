name: Code Checks

on:
    # A PR branch is checked by `pull_request` only, so one push makes one run.
    push:
        branches: [master]
    pull_request:

# A new push stops the older run on the same branch or PR.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        # Defence in depth: the suite spawns subprocesses, and a regression that
        # makes one go silent must not become an endless job.
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run fmt:check
            - run: npm run check
            - run: npm run test
            - run: npm run selftest
            - run: npm run knip
