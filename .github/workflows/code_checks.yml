name: Code Checks

on:
    # A PR branch is checked by `pull_request` only, so one push makes one run.
    push:
        branches: [master]
    pull_request:

# A new push stops the older run on the same branch or PR.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        # Set the repo variable RUNNER to `self-hosted` to run on our own
        # machine. Delete it to go back to GitHub's runners.
        runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
        # Defence in depth: the suite spawns subprocesses, and a regression that
        # makes one go silent must not become an endless job.
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run fmt:check
            - run: npm run check
            # Ternary on RUNNER (see runs-on): set means `test` (test-file concurrency
            # pinned at 4, tuned for our own machine); unset means `test:adaptive`.
            - run: npm run ${{ vars.RUNNER && 'test' || 'test:adaptive' }}
            - run: npm run selftest
            - run: npm run knip

    package-macos:
        # package.json claims macOS, so pack and run the package there too.
        # Pinned to GitHub's runner, not RUNNER, which can point at our own
        # Linux machine. The test's pty part is Linux-only and skips here.
        runs-on: macos-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: node --test tests/package.test.ts
