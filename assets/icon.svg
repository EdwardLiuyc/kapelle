<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="agent-team">
  <title>agent-team</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2029"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
  </defs>

  <!-- workspace tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- permission boundary: nothing crosses it, whatever the policy says -->
  <polygon points="256,70 417.08,163 417.08,349 256,442 94.92,349 94.92,163"
           fill="none" stroke="#39424F" stroke-width="26" stroke-linejoin="round"/>

  <!-- stdio links, hub to peer -->
  <g stroke="#4C5A6E" stroke-width="15" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="136"/>
    <line x1="256" y1="256" x2="152.08" y2="316"/>
    <line x1="256" y1="256" x2="359.92" y2="316"/>
  </g>

  <!-- peers: unlike each other on purpose -->
  <circle cx="256" cy="136" r="34" fill="#5CC8FF"/>
  <polygon points="152.08,278 119.17,335 184.99,335"
           fill="#C792EA" stroke="#C792EA" stroke-width="11" stroke-linejoin="round"/>
  <rect x="328.92" y="285" width="62" height="62" rx="16" fill="#FFB454"/>

  <!-- the client: one process, one prompt -->
  <rect x="210" y="210" width="92" height="92" rx="22" fill="#F2F5F9"/>
  <polyline points="243,234 267,256 243,278"
            fill="none" stroke="#0D1117" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
